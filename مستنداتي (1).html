<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منظّم المستندات</title>
<style>
:root{--bg:#121212;--card:#1c1c1c;--bd:#2a2a2a;--pri:#1a73e8;--ok:#1a3a2a;--okb:#1f9d55;--tx:#fff;--tx2:#9aa0a6;--dr:#0f172a;--warn:#f59e0b;--bad:#ef4444}
body.light{--bg:#f4f6f9;--card:#fff;--bd:#dfe3e8;--ok:#e3f6ea;--tx:#1b1f24;--tx2:#5f6368;--dr:#0f172a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,Cairo,system-ui,"Segoe UI",Arial,sans-serif;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
#top{position:fixed;top:0;inset-inline:0;height:58px;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:30}
.ib{min-width:44px;height:44px;border:0;background:none;font-size:22px;cursor:pointer;border-radius:12px}
#q{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--bd);background:var(--card);padding:0 14px;outline:none}
#main{padding:72px 14px 100px;max-width:760px;margin:auto}
h2{margin:6px 0 12px;font-size:22px}h3{margin:18px 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.qa{min-height:76px;background:var(--card);border:1px solid var(--bd);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;padding:6px;transition:transform .2s}
.qa:active{transform:scale(.96)}.qa b{font-size:26px}.qa.p{background:var(--pri);border-color:var(--pri);color:#fff}
.st{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 10px;min-height:92px;cursor:pointer}
.st i{position:absolute;top:8px;inset-inline-start:auto;inset-inline-end:8px;font-style:normal;font-size:22px}
.st b{display:block;font-size:22px;margin-top:22px;overflow-wrap:anywhere}.st span{font-size:12px;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #0003}
.doc{cursor:pointer}.doc .n{font-weight:700;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--tx2);margin-top:4px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;margin-top:6px;background:var(--ok);border:1px solid var(--okb)}
.badge.w{background:#3a2a0a;border-color:var(--warn)}.badge.r{background:#3a1212;border-color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button,.btn{min-height:44px;min-width:44px;border:1px solid var(--bd);background:transparent;border-radius:12px;cursor:pointer;padding:0 12px}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.d{border-color:var(--bad);color:var(--bad)}
.sync{border:2px solid var(--okb);background:var(--ok)}.sync.w{border-color:var(--warn);background:#3a2a0a}
body.light .sync.w,body.light .badge.w{background:#fff3d6}body.light .badge.r{background:#fde4e4}
#fab{position:fixed;bottom:20px;left:18px;width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:26px;z-index:25;box-shadow:0 4px 12px #0006;cursor:pointer}
#fm{position:fixed;bottom:88px;left:18px;background:var(--card);border:1px solid var(--bd);border-radius:14px;z-index:25;display:none;overflow:hidden}
#fm button{display:block;width:100%;min-height:46px;padding:0 18px;border:0;background:none;text-align:start;cursor:pointer}
#ov{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#dr{position:fixed;top:0;bottom:0;inset-inline-start:auto;right:0;width:min(55%,280px);min-width:220px;background:var(--dr);color:#fff;z-index:41;transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;overflow:auto;padding-top:10px}
body.open #dr{transform:none;visibility:visible}body.open #ov{opacity:1;pointer-events:auto}
#dr a{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;cursor:pointer;border-inline-end:4px solid transparent;font-size:15px}
#dr a.on{background:#ffffff1f;border-inline-end-color:var(--pri)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 22px;border-radius:22px;z-index:60;display:none;box-shadow:0 2px 10px #0006}
#md{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#md>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
#md label{display:block;font-size:13px;color:var(--tx2);margin:8px 0 3px}
#md input,#md select,#md textarea{width:100%;min-height:42px;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:6px 10px}
.empty{text-align:center;color:var(--tx2);padding:30px 10px}
iframe,.pv img{width:100%;border:0;border-radius:12px;background:#fff}iframe{height:60vh}.pv img{background:none}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:10px;border-radius:10px;max-height:60vh;overflow:auto}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar div{height:100%;background:var(--pri)}
.crumb{font-size:13px;color:var(--tx2);margin-bottom:8px}.crumb a{color:var(--pri);cursor:pointer}
</style>
</head>
<body>
<div id="top">
 <button class="ib" data-a="menu" aria-label="القائمة">☰</button>
 <input id="q" type="search" placeholder="بحث في الملفات والمجلدات والوسوم...">
 <button class="ib" data-a="theme" aria-label="السمة">🌗</button>
</div>
<div id="ov" data-a="close"></div>
<nav id="dr"></nav>
<div id="main"></div>
<button id="fab" data-a="fab">➕</button>
<div id="fm"><button data-a="addFile">📄 إضافة ملف</button><button data-a="addImg">🖼️ إضافة صورة</button><button data-a="scan">📷 مسح مستند</button><button data-a="newFolder">📁 مجلد جديد</button></div>
<div id="toast">تم الحفظ</div>
<div id="md"><div id="mb"></div></div>
<input type="file" id="fIn" multiple hidden>
<input type="file" id="iIn" accept="image/*" multiple hidden>
<input type="file" id="sIn" accept="image/*" capture="environment" hidden>
<input type="file" id="bIn" accept=".json,application/json" hidden>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NAV=[["home","🏠","الرئيسية"],["files","📁","الملفات والمجلدات"],["renew","🔄","التجديدات"],["fav","⭐","المفضلة"],["pin","📌","الوصول السريع"],["trash","🗑️","سلة المحذوفات"],["log","📋","سجل النشاط"],["share","📤","مشاركة عبر واتساب"],["storage","💾","التخزين"],["status","📊","حالة التطبيق"],["settings","⚙️","الإعدادات"]];
let DB={v:1,files:[],folders:[],log:[],prefs:{theme:"dark",email:"",lastBackup:null,dirty:false,backupSize:0}};
let S={view:"home",folder:null,id:null,q:"",sel:new Set()},idb,pvURL=null;
/* ---------- IndexedDB ---------- */
function open(){return new Promise((res,rej)=>{const r=indexedDB.open("docorg",1);r.onupgradeneeded=()=>{r.result.createObjectStore("meta");r.result.createObjectStore("blobs")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const MEM={meta:{},blobs:{}};
const tx=(st,m,fn)=>!idb?Promise.resolve((fn({put:(v,k)=>{MEM[st][k]=v},get:k=>({result:MEM[st][k]}),delete:k=>{delete MEM[st][k]},clear:()=>{MEM[st]={}}})||{}).result):new Promise((res,rej)=>{const t=idb.transaction(st,m),o=fn(t.objectStore(st));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const saveMeta=()=>tx("meta","readwrite",s=>s.put(DB,"db"));
const getBlob=id=>tx("blobs","readonly",s=>s.get(id));
async function commit(msg,silent){DB.prefs.dirty=true;try{await saveMeta();if(!silent)toast()}catch(e){alert("تعذّر الحفظ: التخزين غير متاح أو ممتلئ")}render()}
/* ---------- helpers ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const fmtD=t=>{const d=new Date(t);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const size=b=>b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB";
function rel(t){const m=Math.floor((Date.now()-t)/6e4);if(m<1)return"الآن";if(m<60)return`منذ ${m} دقيقة`;const h=Math.floor(m/60);if(h<24)return`منذ ${h} ساعات`;return`منذ ${Math.floor(h/24)} يوم`}
function days(f){if(!f.exp)return null;const e=new Date(f.exp+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);return Math.round((e-n)/864e5)}
function toast(m){const t=$("#toast");t.textContent=m||"تم الحفظ";t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1600)}
function log(type,desc){DB.log.unshift({id:uid(),type,desc,t:Date.now()})}
const live=()=>DB.files.filter(f=>!f.del),fld=id=>DB.folders.find(x=>x.id===id),F=id=>DB.files.find(f=>f.id===id);
const path=id=>{const a=[];let c=fld(id);while(c){a.unshift(c.name);c=fld(c.parent)}return a.join(" / ")||"الرئيسية"};
function modal(html,ok,okText){$("#mb").innerHTML=html+`<div class="acts"><button class="btn p" id="mok">${okText||"حفظ"}</button><button class="btn" id="mno">إلغاء</button></div>`;$("#md").style.display="flex";$("#mno").onclick=closeM;$("#mok").onclick=async()=>{if(await ok()!==false)closeM()}}
function closeM(){$("#md").style.display="none"}
const val=i=>($("#"+i)||{}).value||"";
const folderOpts=(sel,ex)=>`<option value="">📁 الرئيسية</option>`+DB.folders.filter(x=>!x.del&&x.id!==ex).map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(path(x.id))}</option>`).join("");
/* ---------- rendering ---------- */
function docCard(f,extra){const d=days(f),sync=DB.prefs.lastBackup&&DB.prefs.lastBackup>=f.mod;
return `<div class="card doc" data-a="open" data-id="${f.id}"><div class="n">${esc(f.name)}</div>
<div class="meta">${size(f.size)} • ${fmtD(f.added)} • ${rel(f.added)}${f.folder?" • 📁 "+esc(fld(f.folder)?.name||""):""}</div>
<span class="badge ${sync?"":"w"}">${sync?"☁️ تمت المزامنة (نسخة احتياطية)":"⏳ لم تُحفظ في نسخة احتياطية"}</span>
${f.tags.length?`<div class="meta">🏷️ ${f.tags.map(esc).join("، ")}</div>`:""}${extra||""}
<div class="acts"><button data-a="del" data-id="${f.id}">🗑️</button><button data-a="wa" data-id="${f.id}">📤</button><button data-a="goFolder" data-id="${f.id}">📂</button><button data-a="edit" data-id="${f.id}">✏️</button><button data-a="pin" data-id="${f.id}">${f.pin?"📌":"📍"}</button><button data-a="fav" data-id="${f.id}">${f.fav?"⭐":"☆"}</button></div></div>`}
const list=(a,m)=>a.length?a.map(docCard).join(""):`<div class="empty">${m||"لا توجد مستندات"}</div>`;
function reminders(){const L=live().map(f=>[f,days(f)]).filter(x=>x[1]!==null);const ex=L.filter(x=>x[1]<0),so=L.filter(x=>x[1]>=0&&x[1]<=30);
return ex.length||so.length?`<div class="card" style="border-color:var(--warn)">🔔 ${ex.length?`<b>${ex.length}</b> مستند منتهٍ`:""} ${ex.length&&so.length?"و":""} ${so.length?`<b>${so.length}</b> ينتهي خلال 30 يومًا`:""}</div>`:""}
async function storageInfo(){let u=0,q=0;try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();u=e.usage||0;q=e.quota||0}}catch(e){}return{u,q}}
function render(){
 document.body.classList.toggle("light",DB.prefs.theme==="light");
 $("#dr").innerHTML=NAV.map(n=>`<a data-a="go" data-id="${n[0]}" class="${S.view===n[0]?"on":""}"><span>${n[1]}</span>${n[2]}</a>`).join("");
 let h="";const L=live(),m=$("#main");
 if(S.q.trim()){const q=S.q.trim().toLowerCase();
  const rf=L.filter(f=>(f.name+" "+f.tags.join(" ")+" "+(f.notes||"")+" "+(f.desc||"")+" "+path(f.folder)).toLowerCase().includes(q));
  const rd=DB.folders.filter(x=>!x.del&&x.name.toLowerCase().includes(q));
  h=`<h2>🔍 نتائج البحث</h2>`+rd.map(x=>`<div class="card" data-a="openFolder" data-id="${x.id}">📁 ${esc(path(x.id))}</div>`).join("")+list(rf,"لا نتائج مطابقة");m.innerHTML=h;return}
 switch(S.view){
 case"home":{const ex=L.filter(f=>f.exp),exp30=ex.filter(f=>{const d=days(f);return d>=0&&d<=30}),del=DB.files.filter(f=>f.del).length+DB.folders.filter(x=>x.del).length,p=DB.prefs,dirty=p.dirty;
  h=`<h2>🏠 الرئيسية</h2>${idb?"":`<div class="card" style="border-color:var(--warn)">⚠️ التخزين الدائم غير متاح في هذه البيئة (مثل المعاينة داخل Claude). البيانات مؤقتة وستضيع عند الإغلاق. افتح الملف في Chrome أو WebView لتعمل كل الميزات.</div>`}${reminders()}<div class="grid">
  <button class="qa p" data-a="addFile"><b>➕</b>إضافة ملف</button><button class="qa" data-a="scan"><b>📷</b>مسح مستند</button><button class="qa" data-a="addImg"><b>🖼️</b>إضافة صورة</button>
  <button class="qa" data-a="newFolder"><b>📁</b>مجلد جديد</button><button class="qa" data-a="focusQ"><b>🔍</b>بحث</button><button class="qa" data-a="go" data-id="fav"><b>⭐</b>المفضلة</button>
  <button class="qa" data-a="go" data-id="trash"><b>🗑️</b>سلة المحذوفات</button><button class="qa" data-a="go" data-id="share"><b>📤</b>مشاركة واتساب</button></div>
  <h3>📊 الإحصائيات</h3><div class="grid">
  ${[["📄",L.length,"إجمالي المستندات","files"],["📁",DB.folders.filter(x=>!x.del).length,"إجمالي المجلدات","files"],["🔄",ex.length,"مستندات للتجديد","renew"],["⚠️",exp30.length,"تنتهي خلال 30 يومًا","renew"],["⭐",L.filter(f=>f.fav).length,"المفضلة","fav"],["🗑️",del,"المحذوفات","trash"]].map(s=>`<div class="st" data-a="go" data-id="${s[3]}"><i>${s[0]}</i><b>${s[1]}</b><span>${s[2]}</span></div>`).join("")}
  <div class="st" data-a="go" data-id="storage"><i>💾</i><b id="drv" style="font-size:14px">${p.email?esc(p.email):"غير متصل"}</b><span>Google Drive: ${p.email?"بريد يدوي (غير موثّق)":"غير متصل"}</span></div>
  <div class="st" data-a="go" data-id="status"><i>☁️</i><b style="font-size:14px">${dirty?"معلّقة":"محدّثة"}</b><span>المزامنة والنسخ</span></div></div>
  <h3>☁️ حالة النسخ الاحتياطي</h3><div class="card sync ${dirty?"w":""}">${dirty?"⚠️ توجد تغييرات غير محفوظة":"☁️ تمت المزامنة"}<div class="meta">آخر نسخة احتياطية: ${p.lastBackup?fmtD(p.lastBackup):"لم تُنشأ بعد"}</div><div class="acts"><button class="btn p" data-a="export">💾 نسخة احتياطية الآن</button></div></div>
  <h3>🕐 الملفات الأخيرة</h3>${list([...L].sort((a,b)=>b.mod-a.mod).slice(0,8),"لا توجد ملفات بعد — اضغط ➕ لإضافة أول مستند")}`;break}
 case"files":{const cur=S.folder,fs=DB.folders.filter(x=>!x.del&&x.parent===cur),ds=L.filter(f=>f.folder===cur);
  const cr=[`<a data-a="openFolder" data-id="">الرئيسية</a>`];{let c=cur,a=[];while(c){a.unshift(c);c=fld(c)?.parent}a.forEach(i=>cr.push(`<a data-a="openFolder" data-id="${i}">${esc(fld(i).name)}</a>`))}
  h=`<h2>📁 الملفات والمجلدات</h2><div class="crumb">${cr.join(" ‹ ")}</div><div class="acts" style="margin:0 0 10px"><button class="btn p" data-a="addFile">➕ ملف</button><button class="btn" data-a="newFolder">📁 مجلد</button></div>`+
  fs.map(x=>{const n=DB.files.filter(f=>!f.del&&f.folder===x.id).length;return `<div class="card doc" data-a="openFolder" data-id="${x.id}"><div class="n">📁 ${esc(x.name)}</div><div class="meta">${n} مستند • ${DB.folders.filter(y=>!y.del&&y.parent===x.id).length} مجلد فرعي</div><div class="acts"><button data-a="renF" data-id="${x.id}">✏️</button><button data-a="pinF" data-id="${x.id}">${x.pin?"📌":"📍"}</button><button data-a="movF" data-id="${x.id}">↪️</button><button data-a="delF" data-id="${x.id}">🗑️</button></div></div>`}).join("")+list(ds,fs.length?"":"المجلد فارغ");break}
 case"renew":{const A=L.filter(f=>f.exp).sort((a,b)=>days(a)-days(b)),B=L.filter(f=>!f.exp);
  const row=f=>{const d=days(f),c=d<0?"r":d<=30?"w":"",t=d<0?`منتهٍ منذ ${-d} يوم`:d===0?"ينتهي اليوم":`متبقٍ ${d} يوم`,s=d<0?"❌ منتهي":d<=7?"🔴 ينتهي خلال 7 أيام":d<=30?"🟠 ينتهي خلال 30 يومًا":"🟢 ساري";
   return docCard(f,`<div class="meta">📅 الانتهاء: ${f.exp} • <span class="badge ${c}">${s} • ${t}</span></div>${f.notes?`<div class="meta">📝 ${esc(f.notes)}</div>`:""}`)};
  h=`<h2>🔄 التجديدات</h2>${reminders()}${A.length?A.map(row).join(""):`<div class="empty">لا توجد مستندات بتاريخ انتهاء. أضف التاريخ عبر ✏️ تعديل.</div>`}${B.length?`<h3>بدون تاريخ انتهاء</h3><div class="meta">لن تُولَّد تنبيهات لهذه المستندات (${B.length})</div>`:""}`;break}
 case"fav":h=`<h2>⭐ المفضلة</h2>`+list(L.filter(f=>f.fav),"لا توجد مفضلة");break;
 case"pin":{const pf=DB.folders.filter(x=>!x.del&&x.pin);h=`<h2>📌 الوصول السريع</h2>`+pf.map(x=>`<div class="card doc" data-a="openFolder" data-id="${x.id}">📁 ${esc(path(x.id))}</div>`).join("")+list(L.filter(f=>f.pin),pf.length?"":"لا توجد عناصر مثبّتة");break}
 case"trash":{const tf=DB.folders.filter(x=>x.del&&!fld(x.parent)?.del||x.del&&fld(x.parent)?.del!==x.del),td=DB.files.filter(f=>f.del);
  h=`<h2>🗑️ سلة المحذوفات</h2>${tf.length||td.length?`<button class="btn d" data-a="empty" style="margin-bottom:10px">إفراغ السلة</button>`:""}`+
  tf.map(x=>`<div class="card"><div class="n">📁 ${esc(x.name)}</div><div class="meta">حُذف: ${fmtD(x.del)}</div><div class="acts"><button class="btn" data-a="resF" data-id="${x.id}">♻️ استعادة</button><button class="btn d" data-a="permF" data-id="${x.id}">حذف نهائي</button></div></div>`).join("")+
  td.map(f=>`<div class="card"><div class="n">${esc(f.name)}</div><div class="meta">${size(f.size)} • حُذف: ${fmtD(f.del)}</div><div class="acts"><button class="btn" data-a="res" data-id="${f.id}">♻️ استعادة</button><button class="btn d" data-a="perm" data-id="${f.id}">حذف نهائي</button></div></div>`).join("")+(tf.length||td.length?"":`<div class="empty">السلة فارغة</div>`);break}
